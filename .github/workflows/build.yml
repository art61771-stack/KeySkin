name: KeySkin arm64e prototype
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: brew install dpkg
      - name: Production content UIKit test (iOS16 only)
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          # Inspect installed Xcodes/runtimes only. No large runtime download,
          # and no simulator on iOS17/18/26 may be created or booted.
          { xcodebuild -version; xcodebuild -showsdks; ls -d /Applications/Xcode*.app; } > build/xcode-inventory.txt
          FOUND=0
          for XCODE in "$(xcode-select -p)" /Applications/Xcode*.app/Contents/Developer; do
            export DEVELOPER_DIR="$XCODE"
            if ! xcrun simctl list -j > build/simulators.json; then continue; fi
            python3 tests/select_ios16.py build/simulators.json build/simulator-selection.txt
            if ! grep -q '^NOT RUN:' build/simulator-selection.txt; then FOUND=1; break; fi
          done
          if [[ "$FOUND" == 0 ]]; then
            echo 'NOT RUN: iOS16 runtime unavailable' | tee build/prefs-uikit.log
            echo '### NOT RUN: iOS16 runtime unavailable (not a test PASS)' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          RUNTIME=$(sed -n '1p' build/simulator-selection.txt)
          TYPE=$(sed -n '2p' build/simulator-selection.txt)
          KS_SIMULATOR_UDID=$(xcrun simctl create KeySkin-015-CI "$TYPE" "$RUNTIME")
          export KS_SIMULATOR_UDID
          cleanup() { xcrun simctl shutdown "$KS_SIMULATOR_UDID" || true; xcrun simctl delete "$KS_SIMULATOR_UDID" || true; }
          trap cleanup EXIT
          xcrun simctl boot "$KS_SIMULATOR_UDID"
          xcrun simctl bootstatus "$KS_SIMULATOR_UDID" -b
          bash tests/run_prefs_uikit.sh 2>&1 | tee build/prefs-uikit.log
      - name: Compile sign package verify
        shell: bash
        run: |
          set -euo pipefail
          bash build.sh 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KeySkin-0.1.5
          path: |
            build/*.deb
            build/SHA256SUMS
            build/offscreen.ppm
            build/prefs-uikit.log
            build/simulator-selection.txt
            build/simulators.json
            build/xcode-inventory.txt
            build.log
          if-no-files-found: error
